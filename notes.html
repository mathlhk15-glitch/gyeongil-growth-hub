<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="세 사이트가 함께 쓰는 학생 탐구노트. 질문, 방법, 근거, 수정, 생각의 변화를 기록하고 활동 후 제출할 자기평가서를 만듭니다.">
<title>내 탐구노트 · 경일 진로·탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="hub.css">
<style>
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:820px){.side{position:static}}
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
@media (max-width:820px){.nlist{max-height:none}}
.nlist button{width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.nlist button[aria-current="true"]{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.nlist .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist .m{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.tools{display:flex;flex-direction:column;gap:6px}
.tools .btn{width:100%}
.editor{display:flex;flex-direction:column;gap:16px;min-width:0}
.ehead{display:flex;flex-direction:column;gap:8px}
.ehead input.title{font:inherit;font-family:var(--f-display);font-size:1.6rem;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:4px 0;width:100%}
.ehead input.title:focus{outline:none;border-bottom-color:var(--primary)}
.status{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:700;background:transparent;border:0;color:var(--muted);min-height:44px;padding:0 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--primary)}
.pane{display:flex;flex-direction:column;gap:18px}
.f{display:flex;flex-direction:column;gap:6px}
.f > label,.f > .lab{font-weight:700}
.f .hint{font-size:.85rem;color:var(--muted);font-weight:400}
input[type=text],textarea,select{font:inherit;font-size:.98rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%;min-height:44px}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{font:inherit;font-size:.92rem;min-height:44px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.choices button[aria-pressed="true"]{border-color:var(--primary);background:var(--soft);font-weight:700}
.choices button[aria-pressed="true"]::before{content:"✓"}
.choices .rec{font-size:.72rem;color:var(--accent);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.levels button{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:44px}
.levels button[aria-pressed="true"]{border-color:var(--primary);background:var(--soft)}
.levels b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.levels .ex{font-size:.82rem;color:var(--muted)}
.evi{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.evi .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.evi label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.chain{display:flex;flex-wrap:wrap;gap:4px;font-size:.82rem;color:var(--muted)}
.chain span{background:var(--soft);border-radius:4px;padding:1px 6px}
.chain span.hl{background:var(--warn-soft);color:var(--warn);font-weight:700}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.scope .card p{font-size:.9rem}
.scope .bad::before{content:"✕ ";color:var(--bad);font-weight:700}
.scope .good::before{content:"○ ";color:var(--accent);font-weight:700}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--primary)}
.frame{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center}
.frame span{font-size:.9rem;color:var(--muted)}
pre.sum{white-space:pre-wrap;word-break:keep-all;font:inherit;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0}
.conflict{border:2px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.empty{padding:32px 0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.links{font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px}
details.ai{border:1px dashed var(--line);border-radius:6px;padding:10px 14px;background:var(--surface)}
details.ai summary{cursor:pointer;font-weight:700;min-height:32px}
@media print{.layout{display:block}.side,.tabs,.ehead .row{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <aside class="side no-print" aria-label="내 탐구 목록">
      <h1 style="font-size:1.6rem">📓 내 탐구노트</h1>
      <a class="btn" href="?new=1" id="newBtn">새 탐구노트</a>
      <ul class="nlist" id="nlist"></ul>
      <div class="tools">
        <button class="btn quiet" type="button" id="exportBtn">내 탐구노트 저장하기</button>
        <label class="btn quiet" for="importFile">내 탐구노트 불러오기</label>
        <input type="file" id="importFile" accept=".json,application/json" class="sr-only">
        <p class="small muted" id="ioMsg" role="status"></p>
        <button class="btn quiet" type="button" id="modeBtn"></button>
        <p class="small muted" id="modeText"></p>
        <p class="small notice" id="publicPcTip">공용 PC라면 사용이 끝난 뒤 아래 <b>“이 기기의 탐구노트 모두 지우기”</b>를 꼭 눌러 주세요.</p>
        <button class="btn danger" type="button" id="clearAllBtn">이 기기의 탐구노트 모두 지우기</button>
      </div>
    </aside>
    <main class="editor" id="editor" tabindex="-1"></main>
  </div>
</div>
<script src="inquiry-standard.js"></script>
<script src="inquiry-notes.js"></script>
<script src="notes.js"></script>
</body>
</html>
